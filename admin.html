<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>K Loyalty - الإدارة العامة</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- QR -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>

    <!-- Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', Arial, sans-serif;
        }

        body {
            background: #0b0b0b;
            color: white;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            margin: auto;
        }

        /* =========================
           الهيدر
        ========================= */

        .header {
            background: #151515;
            border: 1px solid #292929;
            border-radius: 20px;
            padding: 20px 25px;
            margin-bottom: 20px;
        }

        .logo {
            color: #d4af37;
            font-size: 28px;
            font-weight: 800;
        }

        .subtitle {
            color: #888;
            font-size: 14px;
            margin-top: 2px;
        }

        /* =========================
           إضافة مشروع
        ========================= */

        .add-box {
            background: #151515;
            border: 1px solid #292929;
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .add-title {
            color: #d4af37;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .inputs {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
        }

        input {
            width: 100%;
            padding: 13px;
            background: #202020;
            color: white;
            border: 1px solid #333;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #d4af37;
        }

        .add-button {
            width: 100%;
            padding: 13px;
            margin-top: 12px;
            background: #d4af37;
            color: #111;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        .add-button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .message {
            text-align: center;
            margin-top: 10px;
            min-height: 20px;
        }

        /* =========================
           الإحصائيات
        ========================= */

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat {
            background: #151515;
            border: 1px solid #292929;
            border-radius: 16px;
            padding: 18px;
            text-align: center;
        }

        .stat-title {
            color: #888;
            margin-bottom: 8px;
        }

        .stat-number {
            font-size: 28px;
            font-weight: bold;
        }

        .total-number {
            color: #d4af37;
        }

        .active-number {
            color: #76e39b;
        }

        .inactive-number {
            color: #ff7777;
        }

        /* =========================
           المشاريع
        ========================= */

        .projects-box {
            background: #151515;
            border: 1px solid #292929;
            border-radius: 18px;
            padding: 20px;
        }.projects-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 18px;
        }

        .projects-title {
            color: #d4af37;
            font-size: 22px;
            font-weight: bold;
        }

        .search {
            max-width: 300px;
        }

        .projects {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .project {
            background: #202020;
            border: 1px solid #333;
            border-radius: 16px;
            padding: 20px;
            cursor: pointer;
            transition: .2s;
        }

        .project:hover {
            border-color: #d4af37;
            transform: translateY(-3px);
        }

        .project-name {
            color: #d4af37;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .project-code {
            color: #aaa;
            font-size: 13px;
            margin-bottom: 6px;
        }

        .project-phone {
            color: #777;
            font-size: 12px;
            margin-bottom: 15px;
        }

        .status {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .active {
            color: #76e39b;
            background: #183322;
        }

        .inactive {
            color: #ff7777;
            background: #351919;
        }

        .empty,
        .loading {
            text-align: center;
            color: #888;
            padding: 30px;
            grid-column: 1 / -1;
        }

        .loading {
            color: #d4af37;
        }

        /* =========================
           التفاصيل
        ========================= */

        .details {
            display: none;
            background: #151515;
            border: 1px solid #d4af37;
            border-radius: 18px;
            padding: 20px;
            margin-top: 20px;
        }

        .details.show {
            display: block;
        }

        .details-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .details-name {
            color: #d4af37;
            font-size: 25px;
            font-weight: bold;
        }

        .close-button {
            padding: 10px 18px;
            background: #333;
            color: white;
            border: none;
            border-radius: 9px;
            cursor: pointer;
        }

        .info {
            background: #202020;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            padding: 10px 0;
            border-bottom: 1px solid #333;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            color: #888;
        }

        .info-value {
            color: white;
            font-weight: bold;
        }

        /* =========================
           الرموز
        ========================= */

        .codes-title {
            color: #aaa;
            margin-bottom: 12px;
            font-weight: bold;
        }

        .codes {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .code-box {
            background: #202020;
            border: 1px solid #333;
            border-radius: 14px;
            padding: 15px;
            text-align: center;
        }

        .code-box.client {
            border-color: #76e39b;
        }

        .code-box.cashier {
            border-color: #d4af37;
        }

        .code-box.admin {
            border-color: #b79cff;
        }.code-title {
            margin-bottom: 10px;
            font-weight: bold;
        }

        .client-color {
            color: #76e39b;
        }

        .cashier-color {
            color: #d4af37;
        }

        .admin-color {
            color: #b79cff;
        }

        .code-value {
            background: #111;
            padding: 10px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            direction: ltr;
            margin-bottom: 10px;
        }

        .copy-button {
            width: 100%;
            padding: 10px;
            background: #444;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        /* =========================
           QR العميل فقط
        ========================= */

        .qr-section {
            background: #202020;
            border-radius: 14px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
        }

        .qr-title {
            color: #76e39b;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .qr {
            width: 210px;
            height: 210px;
            background: white;
            padding: 10px;
            border-radius: 12px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qr img {
            width: 190px;
            height: 190px;
        }

        .qr-link {
            background: #111;
            color: #aaa;
            padding: 10px;
            border-radius: 8px;
            font-size: 11px;
            direction: ltr;
            word-break: break-all;
            margin: 15px 0;
        }

        .qr-button {
            width: 100%;
            padding: 11px;
            background: #333;
            color: white;
            border: none;
            border-radius: 9px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 8px;
        }

        /* =========================
           تشغيل / إيقاف
        ========================= */

        .status-button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 15px;
            margin-bottom: 15px;
            cursor: pointer;
        }

        .stop-button {
            background: #8b2d2d;
            color: white;
        }

        .start-button {
            background: #287a43;
            color: white;
        }

        .delete-button {
            background: #7a1f1f;
            color: #ffb3b3;
            border: 1px solid #a33;
            margin-bottom: 0;
        }

        .delete-button:hover {
            background: #932626;
        }

        /* =========================
           الموبايل
        ========================= */

        @media (max-width: 800px) {

            .inputs {
                grid-template-columns: 1fr;
            }

            .projects {
                grid-template-columns: repeat(2, 1fr);
            }

            .codes {
                grid-template-columns: 1fr;
            }

        }

        @media (max-width: 550px) {

            body {
                padding: 10px;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .projects {
                grid-template-columns: 1fr;
            }

            .projects-header {
                flex-direction: column;
                align-items: stretch;
            }

            .search {
                max-width: none;
            }

            .details-header {
                flex-direction: column;
                gap: 15px;
                align-items: stretch;
            }

            .close-button {
                width: 100%;
            }

        }

        /* =========================
           نافذة تأكيد الحذف
        ========================= */

        .delete-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.85);
            z-index: 999;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .delete-modal.show {
            display: flex;
        }

        .delete-modal-box {
            background: #151515;
            border: 1px solid #a33;
            border-radius: 18px;
            padding: 28px 22px;
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .delete-modal-title {
            color: #ff5555;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .delete-modal-text {
            color: #ccc;
            font-size: 14px;
            line-height: 2;
            margin-bottom: 16px;
        }

        .delete-required-name {
            background: #202020;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 10px 14px;
            color: #d4af37;
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 10px;
            direction: ltr;
            text-align: center;
        }

        .delete-modal-box input {
            width: 100%;
            padding: 14px;
            background: #202020;
            color: white;
            border: 1px solid #333;
            border-radius: 10px;
            outline: none;
            font-size: 16px;
            text-align: center;
            margin-bottom: 10px;
        }

        .delete-modal-box input:focus {
            border-color: #a33;
        }

        .delete-error {
            color: #ff7777;
            font-size: 13px;
            min-height: 20px;
            margin-bottom: 10px;
        }

        .confirm-delete-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #a33;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-bottom: 8px;
        }

        .confirm-delete-button:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        .cancel-delete-button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: #333;
            color: white;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }

    </style>

</head>

<body>


<!-- =========================
     لوحة الإدارة مباشرة
========================= -->

<main
    id="adminPanel"
    class="container"
>


    <!-- الهيدر -->

    <!-- =========================

        </div>

        <div class="inputs">

    <!-- =========================

            </div>

            <div

            >

            </div>

        </div>


        <div class="stat">

            </div>

            <div
                id="active"

            </div>

    <!-- =========================

    <!-- =========================

    <div

        <div

        <!-- الرموز -->

        <div class="qr-section">

            <button
                id="copyClientLink"
                class="qr-button"

            >
                نسخ رابط العميل
            </button>

            <button
                id="downloadQR"
                class="qr-button"
                type="button"

            </button></div>


        <!-- تشغيل / إيقاف -->

        <button

        ></button>

        <!-- حذف المشروع -->

        <button

</main>


<!-- =========================
     نافذة تأكيد الحذف
========================= -->

<div
    id="deleteModal"
    class="delete-modal"
>

    <div class="delete-modal-box">

        <div class="delete-modal-title">
            🗑 تأكيد الحذف النهائي
        </div>

        <div class="delete-modal-text">
            أنت على وشك حذف المشروع نهائياً مع جميع عملائه ونقاطه.
            <br>
            للاستمرار، اكتب اسم المشروع بالأسفل:
        </div>

        <div

            class="delete-required-name"
        ></div>

        <input

        </button>

    </div>

</div>


<script>


    // =====================================
    // SUPABASE
    // =====================================

    const SUPABASE_URL =
        "https://scrswrzdsoqumnkegezm.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_bUmi0XAI1rVidgGWgnSJfw_1Ri9H1uQ";

    const db =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    // =====================================
    // عناصر الصفحة
    // =====================================

    const storeName =
        document.getElementById("storeName");

    const storeCode =
        document.getElementById("storeCode");

    const whatsapp =
        document.getElementById("whatsapp");

    const addButton =
        document.getElementById("addButton");

    const message =
        document.getElementById("message");

    const projects =
        document.getElementById("projects");

    const search =
        document.getElementById("search");

    const total =
        document.getElementById("total");

    const active =
        document.getElementById("active");

    const inactive =
        document.querySelector(
            ".inactive-number"
        );

    const details =
        document.getElementById("details");

    const detailsName =
        document.getElementById("detailsName");

    const info =
        document.getElementById("info");

    const codes =
        document.getElementById("codes");

    const clientQR =
        document.getElementById("clientQR");

    const clientLinkElement =
        document.getElementById("clientLink");

    const copyClientLink =
        document.getElementById(
            "copyClientLink"
        );

    const downloadQR =
        document.getElementById(
            "downloadQR"
        );

    const statusButton =
        document.getElementById(
            "statusButton"
        );

    const closeDetails =
        document.getElementById(
            "closeDetails"
        );

    const deleteButton =
        document.getElementById(
            "deleteButton"
        );

    const deleteModal =
        document.getElementById(
            "deleteModal"
        );

    const deleteRequireName =
        document.getElementById(
            "deleteRequireName"
        );

    const deleteNameInput =
        document.getElementById(
            "deleteNameInput"
        );

    const deleteError =
        document.getElementById(
            "deleteError"
        );

    const confirmDeleteButton =
        document.getElementById(
            "confirmDeleteButton"
        );

    const cancelDeleteButton =
        document.getElementById(
            "cancelDeleteButton"
        );


    let stores = [];

    let selectedStore = null;


    // =====================================
    // توليد رمز عشوائي
    // =====================================

    function generateCode(prefix) {

        const number =
            Math.floor(
                1000 +
                Math.random() * 9000
            );

        return prefix + number;

    }


    // =====================================
    // معرفة مجلد المشروع
    // =====================================

    function getFolder() {

        const url =
            window.location.href;

        return url.substring(
            0,
            url.lastIndexOf("/") + 1
        );

    }


    // =====================================
    // رابط العميل
    // =====================================

    function getClientLink(code) {

        return (
            getFolder() +
            "client.html?code=" +
            encodeURIComponent(code)
        );

    }


    // =====================================
    // تحميل المشاريع
    // =====================================

    async function loadStores() {

        projects.innerHTML =
            '<div class="loading">جاري تحميل المشاريع...</div>';


        const result =
            await db
                .from("stores")
                .select(
                    "id, store_code, store_name, is_active, whatsapp_num, code_client, code_cashier, code_admin"
                )
                .order(
                    "id",
                    {
                        ascending: false
                    }
                );


        if (result.error) {

            projects.innerHTML =
                '<div class="empty">' +
                result.error.message +
                '</div>';

            console.error(result.error);

            return;

        }


        stores =
            result.data || [];updateNumbers();

        showProjects(stores);

    }


    // =====================================
    // الإحصائيات
    // =====================================

    function updateNumbers() {

        total.textContent =
            stores.length;


        let activeCount = 0;


        stores.forEach(
            function (store) {

                if (
                    store.is_active === true
                ) {

                    activeCount++;

                }

            }
        );


        active.textContent =
            activeCount;

        inactive.textContent =
            stores.length -
            activeCount;

    }


    // =====================================
    // عرض المشاريع
    // =====================================

    function showProjects(list) {

        projects.innerHTML = "";


        if (list.length === 0) {

            projects.innerHTML =
                '<div class="empty">' +
                'لا يوجد مشاريع.' +
                '</div>';

            return;

        }


        list.forEach(
            function (store) {

                createProject(store);

            }
        );

    }


    // =====================================
    // مربع المشروع
    // =====================================

    function createProject(store) {

        const box =
            document.createElement("div");

        box.className =
            "project";


        const name =
            document.createElement("div");

        name.className =
            "project-name";

        name.textContent =
            store.store_name ||
            "بدون اسم";

        box.appendChild(name);


        const code =
            document.createElement("div");

        code.className =
            "project-code";

        code.textContent =
            "الكود: " +
            (store.store_code || "-");

        box.appendChild(code);


        const phone =
            document.createElement("div");

        phone.className =
            "project-phone";

        phone.textContent =
            "واتساب: " +
            (store.whatsapp_num || "-");

        box.appendChild(phone);


        const status =
            document.createElement("span");

        status.className =
            "status " +
            (
                store.is_active
                    ? "active"
                    : "inactive"
            );

        status.textContent =
            store.is_active
                ? "● شغال"
                : "● متوقف";

        box.appendChild(status);


        box.onclick =
            function () {

                openDetails(store);

            };


        projects.appendChild(box);

    }


    // =====================================
    // فتح تفاصيل المشروع
    // =====================================

    function openDetails(store) {

        selectedStore =
            store;


        details.classList.add(
            "show"
        );


        detailsName.textContent =
            store.store_name ||
            "بدون اسم";


        info.innerHTML = "";


        addInfo(
            "كود المشروع",
            store.store_code || "-"
        );


        addInfo(
            "واتساب",
            store.whatsapp_num || "-"
        );


        addInfo(
            "الحالة",
            store.is_active
                ? "🟢 المشروع شغال"
                : "🔴 المشروع متوقف"
        );


        // =====================================
        // الرموز
        // =====================================

        codes.innerHTML = "";


        createCodeBox(
            "👤 العميل",
            "client",
            "client-color",
            store.code_client
        );


        createCodeBox(
            "💰 الكاشير",
            "cashier",
            "cashier-color",
            store.code_cashier
        );


        createCodeBox(
            "🏢 إدارة المشروع",
            "admin",
            "admin-color",
            store.code_admin
        );// =====================================
        // QR العميل فقط
        // =====================================

        const link =
            getClientLink(
                store.code_client
            );


        clientLinkElement.textContent =
            link;


        createQR(
            clientQR,
            link
        );


        // =====================================
        // زر حالة المشروع
        // =====================================

        if (store.is_active) {

            statusButton.textContent =
                "إيقاف المشروع";

            statusButton.className =
                "status-button stop-button";

        } else {

            statusButton.textContent =
                "تفعيل المشروع";

            statusButton.className =
                "status-button start-button";

        }


        details.scrollIntoView({
            behavior: "smooth",
            block: "start"
        });

    }


    // =====================================
    // إضافة معلومة
    // =====================================

    function addInfo(
        label,
        value
    ) {

        const row =
            document.createElement(
                "div"
            );

        row.className =
            "info-row";


        const labelElement =
            document.createElement(
                "span"
            );

        labelElement.className =
            "info-label";

        labelElement.textContent =
            label;


        const valueElement =
            document.createElement(
                "span"
            );

        valueElement.className =
            "info-value";

        valueElement.textContent =
            value;


        row.appendChild(
            labelElement
        );

        row.appendChild(
            valueElement
        );


        info.appendChild(row);

    }


    // =====================================
    // مربع الرمز
    // =====================================

    function createCodeBox(
        title,
        type,
        colorClass,
        value
    ) {

        const box =
            document.createElement(
                "div"
            );

        box.className =
            "code-box " +
            type;


        const titleElement =
            document.createElement(
                "div"
            );

        titleElement.className =
            "code-title " +
            colorClass;

        titleElement.textContent =
            title;


        const valueElement =
            document.createElement(
                "div"
            );

        valueElement.className =
            "code-value";

        valueElement.textContent =
            value || "-";


        const copy =
            document.createElement(
                "button"
            );

        copy.className =
            "copy-button";

        copy.textContent =
            "نسخ الرمز";


        copy.onclick =
            function () {

                if (!value) return;


                navigator.clipboard
                    .writeText(value)
                    .then(
                        function () {

                            copy.textContent =
                                "تم النسخ ✅";


                            setTimeout(
                                function () {

                                    copy.textContent =
                                        "نسخ الرمز";

                                },
                                1500
                            );

                        }
                    );

            };


        box.appendChild(
            titleElement
        );

        box.appendChild(
            valueElement
        );

        box.appendChild(
            copy
        );


        codes.appendChild(box);

    }


    // =====================================
    // إنشاء QR
    // =====================================

    function createQR(
        container,
        link
    ) {

        try {const qr =
                qrcode(
                    4,
                    "L"
                );


            qr.addData(link);

            qr.make();


            container.innerHTML =
                qr.createImgTag(
                    5,
                    5
                );

        } catch (error) {

            container.textContent =
                "تعذر إنشاء QR";

            console.error(error);

        }

    }


    // =====================================
    // نسخ رابط العميل
    // =====================================

    copyClientLink.onclick =
        function () {

            const link =
                clientLinkElement.textContent;


            navigator.clipboard
                .writeText(link)
                .then(
                    function () {

                        copyClientLink.textContent =
                            "تم النسخ ✅";


                        setTimeout(
                            function () {

                                copyClientLink.textContent =
                                    "نسخ رابط العميل";

                            },
                            1500
                        );

                    }
                );

        };


    // =====================================
    // حفظ QR
    // =====================================

    downloadQR.onclick =
        function () {

            const image =
                clientQR.querySelector(
                    "img"
                );


            if (!image) {

                alert(
                    "الـ QR غير جاهز."
                );

                return;

            }


            const a =
                document.createElement(
                    "a"
                );


            a.href =
                image.src;


            a.download =
                (
                    selectedStore.store_name ||
                    "client"
                ) +
                "-QR.png";


            a.click();

        };


    // =====================================
    // إغلاق التفاصيل
    // =====================================

    closeDetails.onclick =
        function () {

            details.classList.remove(
                "show"
            );

            selectedStore =
                null;

        };


    // =====================================
    // تشغيل / إيقاف المشروع
    // =====================================

    statusButton.onclick =
        async function () {

            if (!selectedStore)
                return;


            const newStatus =
                !selectedStore.is_active;


            const confirmMessage =
                newStatus
                    ? "هل تريد تفعيل المشروع؟"
                    : "هل تريد إيقاف المشروع؟";


            if (
                !confirm(
                    confirmMessage
                )
            ) {

                return;

            }


            statusButton.disabled =
                true;


            statusButton.textContent =
                "جاري التحديث...";


            const result =
                await db
                    .from("stores")
                    .update({
                        is_active:
                            newStatus
                    })
                    .eq(
                        "id",
                        selectedStore.id
                    );


            if (result.error) {

                alert(
                    "حدث خطأ:\n" +
                    result.error.message
                );

                statusButton.disabled =
                    false;

                return;

            }


            const selectedId =
                selectedStore.id;


            await loadStores();


            const updated =
                stores.find(
                    function (store) {

                        return (
                            store.id ===
                            selectedId
                        );

                    }
                );if (updated) {

                openDetails(
                    updated
                );

            }

        };


    // =====================================
    // حذف المشروع نهائياً
    // =====================================

    deleteButton.onclick =
        function () {

            if (!selectedStore)
                return;

            deleteError.textContent =
                "";

            deleteNameInput.value =
                "";

            confirmDeleteButton.disabled =
                true;

            const storeNameValue =
                selectedStore.store_name ||
                selectedStore.store_code;

            deleteRequireName.textContent =
                storeNameValue;

            deleteModal.classList.add(
                "show"
            );

            deleteNameInput.focus();

        };


    cancelDeleteButton.onclick =
        function () {

            deleteModal.classList.remove(
                "show"
            );

        };


    deleteNameInput.oninput =
        function () {

            const requiredName =
                selectedStore.store_name ||
                selectedStore.store_code;

            const typedValue =
                deleteNameInput.value.trim();

            if (
                typedValue ===
                requiredName
            ) {

                deleteError.textContent =
                    "";

                confirmDeleteButton.disabled =
                    false;

            } else {

                confirmDeleteButton.disabled =
                    true;

            }

        };


    deleteNameInput.onkeydown =
        function (event) {

            if (
                event.key ===
                "Enter"
            ) {

                if (
                    !confirmDeleteButton.disabled
                ) {

                    confirmDeleteButton.click();

                }

            }

        };


    confirmDeleteButton.onclick =
        async function () {

            const requiredName =
                selectedStore.store_name ||
                selectedStore.store_code;

            const typedValue =
                deleteNameInput.value.trim();

            if (
                typedValue !==
                requiredName
            ) {

                deleteError.textContent =
                    "الاسم غير مطابق! أكتب اسم المشروع الصحيح.";

                return;

            }

            confirmDeleteButton.disabled =
                true;

            confirmDeleteButton.textContent =
                "جاري الحذف...";

            try {

                // حذف عملاء المشروع أولاً

                const { error: customersError } =
                    await db
                        .from("customers")
                        .delete()
                        .eq(
                            "store_id",
                            selectedStore.id
                        );

                if (customersError) {

                    throw customersError;

                }

                // حذف خانات الرصيد الخاصة بهذا المشروع

                const { error: balancesError } =
                    await db
                        .from("customer_balances")
                        .delete()
                        .eq(
                            "store_id",
                            selectedStore.id
                        );

                if (balancesError) {

                    // إذا الجدول مش موجود بنكمل

                    console.warn(
                        balancesError
                    );

                }

                // حذف المشروع نفسه

                const result =
                    await db
                        .from("stores")
                        .delete()
                        .eq(
                            "id",
                            selectedStore.id
                        );

                if (result.error) {

                    throw result.error;

                }

                deleteModal.classList.remove(
                    "show"
                );

                details.classList.remove(
                    "show"
                );

                selectedStore =
                    null;

                await loadStores();

                message.style.color =
                    "#76e39b";

                message.textContent =
                    "تم حذف المشروع نهائياً ✅";

            } catch (error) {

                console.error(error);

                deleteError.textContent =
                    "حدث خطأ: " +
                    error.message;

            } finally {

                confirmDeleteButton.disabled =
                    false;

                confirmDeleteButton.textContent =
                    "حذف نهائي";

            }

        };


    // =====================================
    // إضافة مشروع
    // =====================================

    addButton.onclick =
        async function () {

            const name =
                storeName.value.trim();

            const code =
                storeCode.value.trim();

            const phone =
                whatsapp.value.trim();


            message.textContent =
                "";


            if (!name || !code) {

                message.style.color =
                    "#ff7777";

                message.textContent =
                    "اكتب اسم المشروع وكود المشروع.";

                return;

            }


            addButton.disabled =
                true;

            addButton.textContent =
                "جاري الإضافة...";


            try {

                // التأكد من أن كود المشروع غير مستخدم

                const check =
                    await db
                        .from("stores")
                        .select("id")
                        .eq(
                            "store_code",
                            code
                        )
                        .maybeSingle();


                if (check.error) {

                    throw check.error;

                }


                if (check.data) {

                    message.style.color =
                        "#ff7777";

                    message.textContent =
                        "كود المشروع مستخدم مسبقاً.";

                    return;

                }


                // =====================================
                // توليد الرموز
                // =====================================

                const clientCode =
                    generateCode("CL");

                const cashierCode =
                    generateCode("CA");

                const adminCode =
                    generateCode("AD");


                // =====================================
                // إضافة المشروع
                // =====================================

                const result =
                    await db
                        .from("stores")
                        .insert({

                            store_code:
                                code,

                            store_name:
                                name,

                            whatsapp_num:
                                phone,

                            is_active:
                                true,

                            code_client:
                                clientCode,

                            code_cashier:
                                cashierCode,

                            code_admin:
                                adminCode

                        });


                if (result.error) {

                    throw result.error;

                }


                message.style.color =
                    "#76e39b";

                message.textContent =
                    "تم إضافة المشروع وتوليد الرموز بنجاح ✅";


                storeName.value =
                    "";

                storeCode.value =
                    "";

                whatsapp.value =
                    "";


                await loadStores();


            } catch (error) {

                console.error(error);

                message.style.color =
                    "#ff7777";

                message.textContent =
                    "حدث خطأ: " +
                    error.message;

            } finally {

                addButton.disabled =
                    false;

                addButton.textContent =
                    "إضافة المشروع";

            }

        };


    // =====================================
    // البحث
    // =====================================

    search.oninput =
        function () {const text =
                search.value
                    .trim()
                    .toLowerCase();


            if (!text) {

                showProjects(
                    stores
                );

                return;

            }


            const filtered =
                stores.filter(
                    function (store) {

                        const name =
                            (
                                store.store_name ||
                                ""
                            ).toLowerCase();


                        const code =
                            (
                                store.store_code ||
                                ""
                            ).toLowerCase();


                        return (
                            name.includes(text) ||
                            code.includes(text)
                        );

                    }
                );


            showProjects(
                filtered
            );

        };


    // =====================================
    // تشغيل الإدارة مباشرة
    // =====================================

    loadStores();


</script>

</body>

</html>
